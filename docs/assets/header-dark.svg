<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" role="img" aria-label="Kashef: Identify PC hardware from a camera frame">
  <title>Kashef: Identify PC hardware from a camera frame</title>
  <desc>Kashef: Identify PC hardware from a camera frame</desc>
  <defs>
    <clipPath id="typeKD">
      <!-- Base width is the full line, so the text stays readable wherever
           SMIL does not run. The animation overrides it when it does. -->
      <rect x="120" y="116" width="467" height="26">
        <animate attributeName="width" values="0;0;467;467;0" keyTimes="0;0.06;0.55;0.92;1" dur="11s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="878" height="188" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <g transform="translate(40, 62)">
    <path d="M14 24v-6a4 4 0 0 1 4-4h6M46 24v-6a4 4 0 0 0-4-4h-6M14 38v6a4 4 0 0 0 4 4h6M46 38v6a4 4 0 0 1-4 4h-6" stroke="#58a6ff" stroke-width="3.2" fill="none" stroke-linecap="round"/><rect x="24" y="24" width="12" height="12" rx="2.5" fill="#58a6ff"/>
  </g>

  <rect x="100" y="46" width="3" height="98" rx="1.5" fill="#58a6ff" opacity="0.35" />

  <text x="120" y="80" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#e6edf3">Kashef</text>

  <text x="120" y="106" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#8b949e">Identify PC hardware from a camera frame</text>

  <g clip-path="url(#typeKD)">
    <text x="120" y="136" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace" font-size="14" fill="#58a6ff">gemini vision, schema-constrained specs, grounded chat.</text>
  </g>

  <rect x="587" y="120" width="2" height="18" fill="#58a6ff" opacity="0">
    <animate attributeName="x" values="120;120;587;587;120" keyTimes="0;0.06;0.55;0.92;1" dur="11s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.45;0.5;1" dur="1s" repeatCount="indefinite" />
  </rect>
</svg>
